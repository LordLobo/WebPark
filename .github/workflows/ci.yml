name: CI

on:
  push:
    branches: [ main, develop ]
    # Required for the `release` job below. Without this, pushing a tag does not start the
    # workflow at all, so `if: startsWith(github.ref, 'refs/tags/v')` can never be true.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: swiftlint lint --strict

  test-macos:
    name: Test macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Show Swift version
        run: swift --version
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test -v --enable-code-coverage
      
      # Bundle layout differs by toolchain: older SwiftPM merges every test target into one
      # WebParkPackageTests.xctest, while newer builds emit one bundle per target. Discover
      # them instead of hardcoding a name, so adding a test target cannot break coverage.
      - name: Generate coverage report
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA="$BIN/codecov/default.profdata"
          if [ ! -f "$PROFDATA" ]; then
            echo "No profdata at $PROFDATA" >&2
            exit 1
          fi

          ARGS=()
          while IFS= read -r bundle; do
            name=$(basename "$bundle" .xctest)
            binary="$bundle/Contents/MacOS/$name"
            [ -f "$binary" ] || continue
            if [ ${#ARGS[@]} -eq 0 ]; then
              ARGS+=("$binary")
            else
              ARGS+=(-object "$binary")
            fi
          done < <(find "$BIN" -maxdepth 1 -name '*.xctest')

          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Found no .xctest bundles under $BIN" >&2
            exit 1
          fi
          echo "Covering: ${ARGS[*]}"

          xcrun llvm-cov export -format="lcov" \
            "${ARGS[@]}" \
            -instr-profile "$PROFDATA" > coverage.lcov
          echo "coverage.lcov lines: $(wc -l < coverage.lcov)"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # Renamed from `file` to `files` after v4.
          files: ./coverage.lcov
          flags: macos
          fail_ci_if_error: false

  test-ios:
    name: Test iOS
    runs-on: macos-26
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          - 'platform=iOS Simulator,OS=latest,name=iPad (A16)'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Build and Test
        run: |
          xcodebuild test \
            -scheme WebPark \
            -destination '${{ matrix.destination }}' \
            -enableCodeCoverage YES \
            -derivedDataPath .build/ios-test
      
      # Tarred for the same reason as the docs artifact: .xcresult bundles can contain
      # paths the artifact API rejects, and this runs precisely when logs are needed.
      - name: Package iOS test results
        if: failure()
        run: tar -czf ios-test-results.tar.gz -C .build/ios-test/Logs Test

      - name: Upload iOS test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-test-results-${{ strategy.job-index }}
          path: ios-test-results.tar.gz

  test-tvos:
    name: Test tvOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Build and Test
        run: |
          xcodebuild test \
            -scheme WebPark \
            -destination 'platform=tvOS Simulator,OS=latest,name=Apple TV' \
            -enableCodeCoverage YES

  test-watchos:
    name: Build watchOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Build
        run: |
          xcodebuild build \
            -scheme WebPark \
            -destination 'platform=watchOS Simulator,OS=latest,name=Apple Watch Series 11 (46mm)'

  build-linux:
    # Compile-portability check only. The test suite mocks HTTP by installing a custom
    # URLProtocol via URLSessionConfiguration.protocolClasses, which swift-corelibs-foundation
    # ignores, so the tests would compile on Linux and then attempt real network calls.
    name: Build Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

  build-documentation:
    name: Build Documentation
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      # Built with xcodebuild rather than `swift package generate-documentation`, which
      # needs the swift-docc-plugin package dependency. WebPark ships zero dependencies.
      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme WebPark \
            -destination 'platform=macOS' \
            -derivedDataPath .build/docbuild

      - name: Transform archive for static hosting
        run: |
          ARCHIVE=$(find .build/docbuild -type d -name 'WebPark.doccarchive' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No .doccarchive produced by xcodebuild docbuild" >&2
            exit 1
          fi
          echo "Transforming $ARCHIVE"
          xcrun docc process-archive transform-for-static-hosting \
            "$ARCHIVE" \
            --output-path ./docs \
            --hosting-base-path WebPark
      
      # DocC emits filenames such as `decode(_:).json`, and the artifact API rejects any
      # path containing a colon. Uploading a single tarball side-steps the per-file check.
      - name: Package documentation
        run: tar -czf documentation.tar.gz -C ./docs .

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: documentation.tar.gz

  check-formatting:
    name: Check Code Formatting
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Install swift-format
        run: brew install swift-format
      
      - name: Check formatting
        run: |
          swift-format lint --recursive Sources Tests || true
          echo "Note: swift-format is informational only and won't fail the build"

  analyze:
    name: Static Analysis
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Run xcodebuild analyze
        run: |
          swift build --build-tests
          # Static analysis
          xcodebuild analyze \
            -scheme WebPark \
            -destination 'platform=macOS' || true

  check-package:
    name: Validate Package
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Validate Swift Package
        run: swift package dump-package
      
      - name: Check Package Dependencies
        run: swift package show-dependencies

  integration-test:
    name: Integration Tests
    runs-on: macos-26
    needs: [test-macos, test-ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Run integration tests
        run: |
          swift test --filter WebParkIntegrationTests || true
          echo "Integration tests placeholder - implement when needed"

  # Optional: Deploy documentation to GitHub Pages
  deploy-docs:
    name: Deploy Documentation
    runs-on: macos-26
    needs: build-documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Download documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation

      - name: Unpack documentation
        run: |
          mkdir -p docs
          tar -xzf documentation.tar.gz -C docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

  # Create release on tag push
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-macos, test-ios, test-tvos, test-watchos, build-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Extract changelog
        id: changelog
        run: |
          # Print the body of the `## [VERSION]` section, stopping at the next `## [`.
          # A naive `/## \[$VERSION\]/,/## \[/` range collapses to a single line, because
          # the opening line also matches the closing pattern.
          VERSION='${{ steps.version.outputs.VERSION }}'
          CHANGELOG=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
